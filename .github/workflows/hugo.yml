# GitHub Pages 自动部署 workflow
# 文档: https://docs.github.com/en/pages/getting-started-with-github-pages/configuring-a-publishing-source-for-your-github-pages-site
#
# 触发：push 到 main / 手动触发 (workflow_dispatch)
# 工作流：
#   1. checkout（含 Blowfish submodule）
#   2. 安装 Hugo Extended
#   3. hugo --minify 构建
#   4. 用官方 actions/deploy-pages 部署到 GitHub Pages
#
# 前置设置（在 GitHub repo Settings → Pages）：
#   Source 必须选 "GitHub Actions"（不能选 "Deploy from a branch"）

name: Deploy Hugo site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 授予 Pages 部署所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署运行，避免竞态
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive   # 拉取 Blowfish submodule
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.165.0'
          extended: true

      - name: Build with Hugo
        run: hugo --minify

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4